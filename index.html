<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天猫考核数据看板 · 吉曜旗舰店</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f5f7; --card:#fff; --bd:#e4e7ec; --tx:#1f2328; --mu:#6b7280;
    --good:#16a34a; --bad:#dc2626; --flat:#9ca3af; --ac:#2563eb;
    --goodbg:#eafaf0; --badbg:#fdecec;
  }
  body{background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:14px;line-height:1.5;padding:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:16px}
  h1{font-size:19px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--mu);font-size:12.5px;margin-top:5px}
  .sub b{color:var(--tx);font-weight:600}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .ct{font-size:14px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ct .hint{font-weight:400;color:var(--mu);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.grid{grid-template-columns:1fr}}
  .kpi{border:1px solid var(--bd);border-radius:9px;padding:11px 12px;background:#fff}
  .kpi .nm{font-size:12px;color:var(--mu);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .vl{font-size:21px;font-weight:680;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .vl small{font-size:12px;font-weight:500;color:var(--mu);margin-left:2px}
  .kpi .ft{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;flex-wrap:wrap}
  .sc{background:#eef2f7;color:#334155;border-radius:4px;padding:1px 6px;font-weight:600;font-variant-numeric:tabular-nums}
  .ch{font-weight:600;font-variant-numeric:tabular-nums}
  .ch.up{color:var(--good)} .ch.dn{color:var(--bad)} .ch.eq{color:var(--flat)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid #f0f2f5;font-size:12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-right:12px}
  thead th{color:var(--mu);font-weight:600;font-size:11px;border-bottom:1px solid var(--bd)}
  tbody tr:hover{background:#fafbfc}
  td .d{font-weight:600}
  td .sc{padding:1px 4px;margin-left:4px}
  td .c{font-size:10px;margin-left:3px}
  .c.up{color:var(--good)} .c.dn{color:var(--bad)} .c.eq{color:var(--flat)}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  select{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  svg{display:block;width:100%;height:auto}
  footer{color:var(--mu);font-size:11.5px;text-align:center;padding:14px 0 6px;line-height:1.7}
  .empty{padding:26px;text-align:center;color:var(--mu)}
  /* ---- 数据诊断 ---- */
  .dgbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:5px 12px;font:inherit;font-size:12.5px;color:var(--mu);cursor:pointer;border-right:1px solid var(--bd)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--ac);color:#fff;font-weight:600}
  .btn{border:1px solid var(--bd);background:#fff;border-radius:7px;padding:5px 10px;font:inherit;font-size:12.5px;color:var(--mu);cursor:pointer}
  .btn:hover{color:var(--tx);border-color:#c9cfd8}
  .verdict{border-radius:9px;padding:12px 14px;margin-bottom:14px;border:1px solid}
  .verdict.ok{background:var(--goodbg);border-color:#b7e6c8}
  .verdict.warn{background:#fff8e6;border-color:#f2dfa8}
  .verdict.bad{background:var(--badbg);border-color:#f3bdbd}
  .verdict .vt{font-size:13.5px;font-weight:700;margin-bottom:5px}
  .verdict .vd{font-size:12.5px;line-height:1.75;color:#374151}
  .verdict .vd b{color:var(--tx)}
  .dgrp{margin-bottom:12px}
  .dgh{font-size:12.5px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .dgh .n{background:#eef2f7;color:var(--mu);border-radius:9px;padding:1px 7px;font-size:11px;font-weight:600}
  .di{border:1px solid var(--bd);border-left-width:3px;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .di.bad{border-left-color:var(--bad);background:#fffafa}
  .di.warn{border-left-color:#eab308;background:#fffdf6}
  .di.good{border-left-color:var(--good)}
  .di.flat{border-left-color:#d1d5db}
  .di .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .di .h .nm{font-size:13.5px;font-weight:700}
  .di .h .vv{font-size:13px;font-variant-numeric:tabular-nums}
  .di .h .tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#eef2f7;color:var(--mu)}
  .di .h .tag.sev{background:#fdecec;color:#b91c1c}
  .di .h .tag.mid{background:#fff4e0;color:#b45309}
  .di .meta{font-size:11.5px;color:var(--mu);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
  .di .sec{margin-top:8px;font-size:12.5px;line-height:1.8}
  .di .sec .lb{font-weight:700;color:#374151;margin-right:4px}
  .di .sec ol{margin:2px 0 0 18px;padding:0}
  .di .sec li{margin-bottom:2px}
  .di .sec li .p{font-size:10.5px;padding:0 5px;border-radius:3px;margin-right:5px;background:#eef2f7;color:#475569;font-weight:600;vertical-align:1px}
  .di .sec li .p.p0{background:#fdecec;color:#b91c1c}
  .di .sec li .p.p1{background:#fff4e0;color:#b45309}
  .hlbox{display:none;border:1px dashed var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#fafbfc}
  .hlbox.on{display:block}
  .hlgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:820px){.hlgrid{grid-template-columns:repeat(2,1fr)}}
  .hlgrid label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:3px}
  .hlgrid input{width:100%;font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--bd);border-radius:6px}
  .hint2{font-size:11.5px;color:var(--mu);margin-top:7px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>天猫考核数据看板 <span id="shopSelWrap" style="display:none"><select id="shopSel"></select></span></h1>
    <div class="sub"><b id="shop">—</b> · 数据区间 <b id="range">—</b> · 共 <b id="days">0</b> 天 · 更新于 <b id="upd">—</b></div>
  </header>

  <div class="card">
    <div class="ct">最新一天指标 <span class="hint" id="latestDay"></span></div>
    <div class="grid" id="kpis"></div>
    <div class="lg">
      <span><i style="background:var(--good)"></i>绿 = 向好（越低越好的指标下降 / 越高越好的指标上升）</span>
      <span><i style="background:var(--bad)"></i>红 = 恶化</span>
    </div>
  </div>

  <div class="card">
    <div class="ct">趋势 <select id="msel"></select></div>
    <div id="chart"></div>
  </div>

  <div class="card">
    <div class="ct">数据诊断 <span class="hint">自动归因 · 下滑原因 · 解决方案</span></div>
    <div class="dgbar">
      <span style="font-size:12px;color:var(--mu)">对比区间</span>
      <span class="seg" id="dseg">
        <button data-d="1">较前一日</button>
        <button data-d="7">近 7 天</button>
        <button data-d="14">近 14 天</button>
        <button data-d="0" class="on">全部</button>
      </span>
      <button class="btn" id="hlBtn">健康线设置</button>
    </div>
    <div class="hlbox" id="hlbox">
      <div class="hlgrid" id="hlgrid"></div>
      <div class="hint2">用于判断「未达标」的参考线（家具类目经验值），改完点保存即生效，只存在你自己的浏览器里。</div>
      <div style="margin-top:9px"><button class="btn" id="hlSave">保存</button>
        <button class="btn" id="hlReset" style="margin-left:6px">恢复默认</button></div>
    </div>
    <div id="diag"></div>
    <div class="lg">
      <span><i style="background:var(--bad)"></i>红 = 恶化（附原因与方案）</span>
      <span><i style="background:#eab308"></i>黄 = 未达健康线</span>
      <span><i style="background:var(--good)"></i>绿 = 改善</span>
    </div>
  </div>

  <div class="card">
    <div class="ct">每日明细 <span class="hint">数值 · 得分 · 较前一日</span></div>
    <div class="tw"><table id="tbl"></table></div>
  </div>

  <footer>
    数据来源：天猫体验中心 VOC 真实体验分（自动抓取）<br>
    本页为只读看板，每日自动更新 —— <span id="upd2">—</span>
  </footer>
</div>

var M = DATA.metrics;
var SHOPS = DATA.shops || [];
var SI = 0;
var R = {}, DAYS = [], last = null, prev = null;

function useShop(i){
  SI = i;
  var s = SHOPS[SI] || {name:'—', dates:[], records:{}};
  R = s.records || {}; DAYS = s.dates || [];
  last = DAYS.length ? DAYS[DAYS.length-1] : null;
  prev = DAYS.length > 1 ? DAYS[DAYS.length-2] : null;
  renderAll();
}

function fmt(v, u){
  if(v === null || v === undefined) return '—';
  var n = Number(v);
  if(isNaN(n)) return '—';
  var s = (u === '%') ? n.toFixed(2) : (Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(2));
  return s + (u || '');
}
function cls(delta, better){
  if(delta === null || delta === undefined || Math.abs(delta) < 1e-9) return 'eq';
  var improved = better === 'low' ? delta < 0 : delta > 0;
  return improved ? 'up' : 'dn';
}
function arrow(delta){
  if(delta === null || delta === undefined || Math.abs(delta) < 0.005) return '—';
  return (delta > 0 ? '↑' : '↓') + fmt(Math.abs(delta), '');
}

function renderHead(){
  var s = SHOPS[SI] || {};
  document.getElementById('shop').textContent = s.name || '—';
  document.getElementById('range').textContent = DAYS.length ? (DAYS[0] + ' ~ ' + DAYS[DAYS.length-1]) : '—';
  document.getElementById('days').textContent = DAYS.length;
  document.getElementById('upd').textContent = DATA.updatedAt || '—';
  document.getElementById('upd2').textContent = DATA.updatedAt || '—';
  document.getElementById('latestDay').textContent = last ? ('（' + last + '）') : '';
}

function renderKpi(){
  var box = document.getElementById('kpis');
  if(!last){ box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  var html = '';
  M.forEach(function(m){
    var cur = (R[last] || {})[m.key], pv = prev ? (R[prev] || {})[m.key] : null;
    var v = cur ? cur.value : null, scv = cur ? cur.score : null;
    var d = (cur && pv && cur.value !== null && pv.value !== null) ? (cur.value - pv.value) : null;
    html += '<div class="kpi">'
      + '<div class="nm" title="' + m.name + '">' + m.name + '</div>'
      + '<div class="vl">' + fmt(v, m.unit).replace(m.unit, '') + '<small>' + (m.unit||'') + '</small></div>'
      + '<div class="ft"><span class="sc">' + (scv !== null && scv !== undefined ? Number(scv).toFixed(1) : '—') + ' 分</span>'
      + '<span class="ch ' + cls(d, m.better) + '">' + arrow(d) + '</span>'
      + '</div></div>';
  });
  box.innerHTML = html;
}

function fillSel(){
  var s = document.getElementById('msel'), h = '';
  M.forEach(function(m, i){ h += '<option value="' + m.key + '"' + (i===0?' selected':'') + '>' + m.name + '</option>'; });
  s.innerHTML = h;
  if(!s.onchange) s.onchange = function(){ draw(s.value); };
}

function draw(key){
  var m = null;
  M.forEach(function(x){ if(x.key === key) m = x; });
  var el = document.getElementById('chart');
  var pts = DAYS.map(function(d){
    var r = (R[d] || {})[key];
    return { d: d, v: r ? r.value : null, s: r ? r.score : null };
  }).filter(function(p){ return p.v !== null && p.v !== undefined; });
  if(pts.length < 2){ el.innerHTML = '<div class="empty">该指标数据不足</div>'; return; }

  var W = 1000, H = 260, PL = 52, PR = 46, PT = 18, PB = 34;
  var vals = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var pad = (mx - mn) || (Math.abs(mx) || 1);
  mn = mn - pad*0.18; mx = mx + pad*0.18;
  var x = function(i){ return PL + (W-PL-PR) * (pts.length===1 ? .5 : i/(pts.length-1)); };
  var y = function(v){ return PT + (H-PT-PB) * (1 - (v-mn)/((mx-mn)||1)); };

  var g = '';
  for(var i=0;i<=4;i++){
    var vv = mn + (mx-mn)*i/4, yy = y(vv);
    g += '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#eef1f5" stroke-width="1"/>'
       + '<text x="'+(PL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#9aa3af">'+fmt(vv,'').slice(0,6)+'</text>';
  }
  var line = '', area = '', dots = '';
  pts.forEach(function(p, i){
    var px = x(i), py = y(p.v);
    line += (i ? ' L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
    dots += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.2" fill="#fff" stroke="#2563eb" stroke-width="2"/>';
    if(i === pts.length-1){
      dots += '<text x="'+px.toFixed(1)+'" y="'+(py-11)+'" text-anchor="end" font-size="12" font-weight="700" fill="#1f2328">'+fmt(p.v,m.unit)+'</text>';
    }
  });
  area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-PB) + ' L' + x(0).toFixed(1) + ' ' + (H-PB) + ' Z';
  var lbl = '';
  var step = Math.ceil(pts.length/8);
  pts.forEach(function(p, i){
    if(i % step === 0 || i === pts.length-1){
      lbl += '<text x="'+x(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" fill="#9aa3af">'+p.d.slice(5)+'</text>';
    }
  });
  var best = m.better === 'low' ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
  var worst = m.better === 'low' ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:260px">'
    + g
    + '<path d="'+area+'" fill="#2563eb" opacity="0.07"/>'
    + '<path d="'+line+'" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + lbl
    + '</svg>'
    + '<div class="lg"><span>区间最好 <b style="color:#16a34a">'+fmt(best,m.unit)+'</b></span>'
    + '<span>区间最差 <b style="color:#dc2626">'+fmt(worst,m.unit)+'</b></span>'
    + '<span>' + (m.better==='low' ? '越低越好' : '越高越好') + '</span></div>';
}

function renderTable(){
  var t = document.getElementById('tbl');
  if(!DAYS.length){ t.innerHTML = '<tr><td class="empty">暂无数据</td></tr>'; return; }
  var h = '<thead><tr><th>日期</th>';
  M.forEach(function(m){ h += '<th title="' + m.name + '">' + (m.short || m.name) + '</th>'; });
  h += '</tr></thead><tbody>';
  DAYS.slice().reverse().forEach(function(d, idx){
    var r = R[d] || {};
    var pd = DAYS[DAYS.length - 2 - idx] || null, pr = pd ? (R[pd] || {}) : null;
    h += '<tr><td>' + d + '</td>';
    M.forEach(function(m){
      var c = r[m.key], p = pr ? pr[m.key] : null;
      var v = c ? c.value : null, sc = c ? c.score : null;
      var dv = (c && p && c.value !== null && p.value !== null) ? (c.value - p.value) : null;
      h += '<td><span class="d">' + fmt(v, m.unit) + '</span>'
         + '<span class="sc" style="margin-left:5px">' + (sc !== null && sc !== undefined ? Number(sc).toFixed(1) : '—') + '</span>'
         + '<span class="c ' + cls(dv, m.better) + '">' + arrow(dv) + '</span></td>';
    });
    h += '</tr>';
  });
  t.innerHTML = h + '</tbody>';
}

  wangWangRate: {why:[

      {t:'结束前没有确认问题是否真的解决', tag:'service'},
      {t:'情绪类投诉处理生硬，只讲流程不讲方案', tag:'service'}],
    fix:[
      {t:'首问负责制：谁接待谁跟到底，转接必须带上下文', p:'0'},
      {t:'情绪激动客户先用安抚模板，2 分钟内给出明确方案而不是流程说明', p:'0'},
      {t:'结束前固定一句"还有其它需要帮您确认的吗？"再关会话', p:'1'},
      {t:'每天抽 10 条会话做质检，问题话术纳入周培训', p:'2'}]},
  refundTime: {why:[
      {t:'审批层级多，财务 / 仓库确认慢', tag:'aftersale'},
      {t:'大件退货要等回传物流才放款', tag:'aftersale'},
      {t:'夜间、周末无人审单', tag:'aftersale'},
      {t:'争议单卡在协商环节', tag:'aftersale'}],
    fix:[
      {t:'设小额自动退款阈值（建议 ≤200 元），系统直退不进人工', p:'0'},
      {t:'退款专员每天 11:00 / 17:00 / 21:00 三轮清空待审', p:'0'},
      {t:'超 12 小时未审的退款单自动标红并推送主管', p:'0'},
      {t:'大件退货改为"买家上传退货单号即退款"，回件由仓库追', p:'1'}]},
  askRate: {why:[

      {t:'超时不处理（退款 / 补发 / 上门）', tag:'aftersale'},
      {t:'责任推诿：商家与快递互相甩锅', tag:'logistics'}],
    fix:[
      {t:'售后 24 小时内必须给出可选项方案（退款 / 补发 / 补偿三选一）', p:'0'},
      {t:'争议单 12 小时未达成即升级主管介入，别等买家升级平台', p:'0'},
      {t:'已介入订单当天电话联系，先解决问题再走流程', p:'0'},
      {t:'每周复盘介入订单，按原因归到责任岗，重复问题改流程', p:'2'}]}
};

var DMODE = 0;   /* 0=全部 1=较前一日 n=近n天 */

function pickDays(n){
  if(!DAYS.length) return [];
  if(n === 1) return DAYS.slice(-2);
  if(n > 0) return DAYS.slice(-n);
  return DAYS.slice();
}

function analyze(n){
  var days = pickDays(n), res = [];
  M.forEach(function(m){
    var pts = [];
    days.forEach(function(d){
      var r = (R[d] || {})[m.key];
      if(r && r.value !== null && r.value !== undefined) pts.push({d:d, v:r.value, s:r.score});
    });
    if(pts.length < 2){ return; }
    var first = pts[0], lastp = pts[pts.length-1];
    var delta = lastp.v - first.v;
    /* 连续同向恶化天数（从末尾往前数） */
    var wrongDir = function(a, b){ return m.better === 'low' ? (b > a) : (b < a); };
    var streak = 0;
    for(var i = pts.length - 1; i > 0; i--){
      if(wrongDir(pts[i-1].v, pts[i].v)) streak++; else break;
    }
    var vals = pts.map(function(p){ return p.v; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var rel = Math.abs(delta) / Math.max(Math.abs(first.v), 1e-6);
    var worse = m.better === 'low' ? delta > 0 : delta < 0;
    /* 绝对阈值按单位区分：百分比 0.05pp，小时 0.3h */
    var absMin = (m.unit === '小时') ? 0.3 : 0.05;
    var moved = Math.abs(delta) >= absMin && rel >= 0.03;
    var status = moved ? (worse ? 'bad' : 'good') : 'flat';
    var sev = rel >= 0.15 ? 2 : (rel >= 0.05 ? 1 : 0);
    /* 得分变化（天猫口径）兜底：掉 0.3 分以上就算恶化 */
    var sd = null;
    if(first.s !== null && first.s !== undefined && lastp.s !== null && lastp.s !== undefined){
      sd = lastp.s - first.s;
      if(sd <= -0.3 && status !== 'bad'){ status = 'bad'; sev = Math.max(sev, 1); }
      else if(sd >= 0.3 && status === 'flat'){ status = 'good'; }
    }
    /* 连续走坏 3 天以上，即使幅度小也要报警 */
    if(streak >= 3 && status !== 'bad' && worse){ status = 'bad'; sev = Math.max(sev, 0); }
    var below = (HL[m.key] !== undefined) &&
                (m.better === 'low' ? lastp.v > HL[m.key] : lastp.v < HL[m.key]);
    var badDays = 0;
    if(HL[m.key] !== undefined){
      pts.forEach(function(p){
        if(m.better === 'low' ? p.v > HL[m.key] : p.v < HL[m.key]) badDays++;
      });
    }
    res.push({m:m, pts:pts, first:first, last:lastp, delta:delta, rel:rel, sd:sd,
              mn:mn, mx:mx, streak:streak, status:status, sev:sev, below:below, badDays:badDays, n:pts.length,
              abnormal: (Math.abs(mx) > 0 && Math.abs(mn) > 0 && (Math.max(mx,mn)/Math.min(Math.abs(mx),Math.abs(mn)) >= 8))});
  });
  return res;
}

function sevTxt(s){ return s === 2 ? '严重' : (s === 1 ? '明显' : '轻微'); }

function groupOf(r){
  if(r.status === 'bad') return 'bad';
  if(r.below) return 'warn';
  if(r.status === 'good') return 'good';
  return 'flat';
}

/* 全店风险排行（用同样的规则跑一遍每家店） */
function riskTable(){
  var out = [], _R = R, _D = DAYS;
  SHOPS.forEach(function(s, i){
    R = s.records || {}; DAYS = s.dates || [];
    var rows = analyze(DMODE);
    var bad = rows.filter(function(r){ return r.status === 'bad'; });
    var warn = rows.filter(function(r){ return r.below && r.status !== 'bad'; });
    var sev = 0, names = [];
    bad.forEach(function(r){ sev += r.sev + 1; names.push(r.m.name); });
    out.push({i:i, name:s.name, bad:bad.length, warn:warn.length, sev:sev,
              top:names.length ? names[0] : (warn.length ? warn[0].m.name : '—')});
  });
  R = _R; DAYS = _D;
  out.sort(function(a, b){ return (b.sev * 10 + b.warn) - (a.sev * 10 + a.warn); });

  var h = '<div class="dgrp"><div class="dgh">🏪 全店风险排行 <span class="hint" style="font-weight:400;color:var(--mu)">点一行可直接切换店铺</span></div>'
        + '<div class="tw"><table><thead><tr><th>店铺</th><th>恶化项</th><th>未达标项</th><th>风险权重</th><th>首要问题</th></tr></thead><tbody>';
  out.forEach(function(o){
    var cls2 = o.bad >= 3 ? '#b91c1c' : (o.bad ? '#b45309' : (o.warn ? '#a16207' : '#15803d'));
    h += '<tr data-i="' + o.i + '" style="cursor:pointer' + (o.i === SI ? ';background:#f0f6ff' : '') + '">'
       + '<td style="color:' + cls2 + ';font-weight:600">' + o.name + '</td>'
       + '<td>' + o.bad + '</td><td>' + o.warn + '</td>'
       + '<td>' + (o.sev * 10 + o.warn) + '</td>'
       + '<td style="text-align:right">' + o.top + '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  setTimeout(function(){
    var tb = document.querySelectorAll('#diag table tr[data-i]');
    for(var i = 0; i < tb.length; i++){
      tb[i].onclick = function(){
        var idx = parseInt(this.getAttribute('data-i'), 10);
        var sel = document.getElementById('shopSel');
        if(sel){ sel.value = String(idx); }
        useShop(idx);
      };
    }
  }, 0);
  return h;
}

function renderDiag(){
  var box = document.getElementById('diag');
  var rows = analyze(DMODE);
  if(!rows.length){
    box.innerHTML = '<div class="empty">数据不足，至少需要 2 天数据才能诊断</div>';
    return;
  }
  var days = pickDays(DMODE);
  var spanTxt = days.length ? (days[0] + ' → ' + days[days.length-1]) : '—';

  /* 领域聚合 */
  var dom = {};
  rows.forEach(function(r){
    var d = DOMAIN[r.m.key] || '其它';
    dom[d] = dom[d] || {bad:0, warn:0, sev:0, keys:[]};
    if(r.status === 'bad'){ dom[d].bad++; dom[d].sev += (r.sev + 1); dom[d].keys.push(r.m.name); }
    else if(r.below) dom[d].warn++;
  });
  var domList = [];
  for(var d2 in dom) domList.push({name:d2, o:dom[d2]});
  domList.sort(function(a, b){ return (b.o.sev * 10 + b.o.warn) - (a.o.sev * 10 + a.o.warn); });

  var bads = rows.filter(function(r){ return r.status === 'bad'; });
  var warns = rows.filter(function(r){ return r.below && r.status !== 'bad'; });
  var goods = rows.filter(function(r){ return r.status === 'good' && !r.below; });
  var flats = rows.filter(function(r){ return groupOf(r) === 'flat'; });

  /* 综合结论 */
  var vcls = bads.length >= 3 ? 'bad' : ((bads.length || warns.length) ? 'warn' : 'ok');
  var vt = bads.length >= 3 ? '⚠️ 多项指标同时恶化，需要立即处理'
        : (bads.length ? '⚠️ 有 ' + bads.length + ' 项指标在恶化'
        : (warns.length ? '🟡 趋势平稳，但有 ' + warns.length + ' 项未达健康线' : '✅ 各项指标平稳向好'));
  var vd = '对比区间 <b>' + spanTxt + '</b>';
  if(domList.length && (bads.length || warns.length)){
    var lead = domList[0];
    vd += '，问题集中在 <b>' + lead.name + '</b>';
    if(lead.o.keys.length) vd += '（' + lead.o.keys.join('、') + '）';
    if(domList.length > 1 && domList[1].o.bad) vd += '，其次是 <b>' + domList[1].name + '</b>';
    vd += '。';
  } else { vd += '，全线平稳，按现有节奏维持即可。'; }
  if(bads.length){
    var top = bads.slice().sort(function(a, b){ return b.sev - a.sev; })[0];
    vd += ' 首要动作：<b>' + top.m.name + '</b> —— ' + (KB[top.m.key] ? KB[top.m.key].fix[0].t : '');
  }

  var h = '<div class="verdict ' + vcls + '"><div class="vt">' + vt + '</div><div class="vd">' + vd + '</div></div>';

  function itemHtml(r){
    var g = groupOf(r);
    var kb = KB[r.m.key] || {why:[], fix:[]};
    /* 同领域其它指标也在恶化 → 相应原因排序提前 */
    var hot = {};
    rows.forEach(function(x){ if(x.status === 'bad') hot[DOMAIN[x.m.key]] = true; });
    var why = kb.why.slice().sort(function(a, b){
      return (hot[TAG2DOM[b.tag]] ? 1 : 0) - (hot[TAG2DOM[a.tag]] ? 1 : 0);
    });
    var s = '<div class="di ' + g + '">';
    s += '<div class="h"><span class="nm">' + r.m.name + '</span>'
       + '<span class="vv">' + fmt(r.first.v, r.m.unit) + ' → ' + fmt(r.last.v, r.m.unit) + '</span>';
    if(r.status === 'bad') s += '<span class="tag ' + (r.sev === 2 ? 'sev' : 'mid') + '">' + sevTxt(r.sev) + '恶化</span>';
    else if(r.status === 'good') s += '<span class="tag" style="background:var(--goodbg);color:#15803d">改善</span>';
    if(r.below) s += '<span class="tag mid">未达健康线</span>';
    if(r.streak >= 3) s += '<span class="tag sev">连续 ' + r.streak + ' 天走坏</span>';
    if(r.abnormal) s += '<span class="tag">⚠ 数值跨度异常，建议核对录入</span>';
    s += '</div>';
    s += '<div class="meta"><span>变化 ' + arrow(r.delta) + (arrow(r.delta) === '—' ? '' : r.m.unit) + '</span>'
       + '<span>区间最好 ' + fmt(r.m.better === 'low' ? r.mn : r.mx, r.m.unit) + '</span>'
       + '<span>区间最差 ' + fmt(r.m.better === 'low' ? r.mx : r.mn, r.m.unit) + '</span>'
       + '<span>健康线 ' + fmt(HL[r.m.key], r.m.unit) + '</span>'
       + (r.sd !== null ? '<span>得分 ' + Number(r.first.s).toFixed(1) + ' → ' + Number(r.last.s).toFixed(1) + '</span>' : '')
       + (r.badDays ? '<span style="color:#b45309">区间内 ' + r.badDays + '/' + r.n + ' 天不达标</span>' : '')
       + '</div>';
    if(g === 'bad'){
      s += '<div class="sec"><span class="lb">可能原因</span><ol>';
      why.slice(0, 3).forEach(function(w){ s += '<li>' + w.t + '</li>'; });
      s += '</ol></div>';
      s += '<div class="sec"><span class="lb">解决方案</span><ol>';
      kb.fix.forEach(function(f){
        var pt = f.p === '0' ? '24h内' : (f.p === '1' ? '本周' : '长期');
        s += '<li><span class="p p' + f.p + '">' + pt + '</span>' + f.t + '</li>';
      });
      s += '</ol></div>';
    } else if(g === 'warn'){
      s += '<div class="sec"><span class="lb">判断</span>当前值 ' + fmt(r.last.v, r.m.unit)
         + '，未达健康线 ' + fmt(HL[r.m.key], r.m.unit) + '，趋势虽稳但仍要补短板。</div>';
      s += '<div class="sec"><span class="lb">补齐动作</span><ol>';
      kb.fix.slice(0, 3).forEach(function(f){
        var pt = f.p === '0' ? '24h内' : (f.p === '1' ? '本周' : '长期');
        s += '<li><span class="p p' + f.p + '">' + pt + '</span>' + f.t + '</li>'; });
      s += '</ol></div>';
    } else if(g === 'good'){
      s += '<div class="sec"><span class="lb">保持</span>方向正确，维持现有动作，别撤人撤流程。</div>';
    } else {
      s += '<div class="sec"><span class="lb">状态</span>区间内基本持平，无需动作，继续观察。</div>';
    }
    return s + '</div>';
  }

  function grp(cls, title, arr){
    if(!arr.length) return '';
    var s = '<div class="dgrp"><div class="dgh">' + title + '<span class="n">' + arr.length + '</span></div>';
    arr.sort(function(a, b){ return b.sev - a.sev; });
    arr.forEach(function(r){ s += itemHtml(r); });
    return s + '</div>';
  }

  if(SHOPS.length > 1) h += riskTable();

  h += grp('bad',  '🔴 恶化中 —— 已自动给出原因与方案', bads);
  h += grp('warn', '🟡 未达健康线 —— 需要补短板', warns);
  h += grp('good', '🟢 改善中 —— 保持即可', goods);
  h += grp('flat', '⚪ 平稳', flats);
  box.innerHTML = h;
}

function renderHLGrid(){
  var g = document.getElementById('hlgrid'), h = '';
  M.forEach(function(m){
    h += '<div><label>' + m.name + '（' + (m.better === 'low' ? '≤' : '≥') + '，' + m.unit + '）</label>'
       + '<input type="number" step="0.01" data-k="' + m.key + '" value="' + HL[m.key] + '"></div>';
  });
  g.innerHTML = h;
}

function initDiag(){
  var seg = document.getElementById('dseg');
  seg.addEventListener('click', function(e){
    var b = e.target;
    if(b.tagName !== 'BUTTON') return;
    var all = seg.getElementsByTagName('button');
    for(var i = 0; i < all.length; i++) all[i].className = '';
    b.className = 'on';
    DMODE = parseInt(b.getAttribute('data-d'), 10) || 0;
    renderDiag();
  });
  document.getElementById('hlBtn').onclick = function(){
    var box = document.getElementById('hlbox');
    if(box.className.indexOf('on') >= 0){ box.className = 'hlbox'; return; }
    renderHLGrid(); box.className = 'hlbox on';
  };
  document.getElementById('hlSave').onclick = function(){
    var ins = document.getElementById('hlgrid').getElementsByTagName('input'), o = {};
    for(var i = 0; i < ins.length; i++){
      var k = ins[i].getAttribute('data-k'), v = parseFloat(ins[i].value);
      if(!isNaN(v)){ HL[k] = v; o[k] = v; }
    }
    saveHL(o); renderDiag();
    document.getElementById('hlbox').className = 'hlbox';
  };
  document.getElementById('hlReset').onclick = function(){
    for(var k in HL_DEF) HL[k] = HL_DEF[k];
    try{ localStorage.removeItem(HL_KEY); }catch(e){}
    renderHLGrid(); renderDiag();
  };
}

function renderAll(){
  renderHead(); renderKpi(); fillSel(); renderDiag();
  draw(document.getElementById('msel').value);
  renderTable();
}

(function init(){
  document.title = '天猫考核数据看板 · ' + (SHOPS[0] ? SHOPS[0].name : '');
  if(SHOPS.length > 1){
    var w = document.getElementById('shopSelWrap'), s = document.getElementById('shopSel'), h = '';
    SHOPS.forEach(function(x, i){ h += '<option value="' + i + '">' + x.name + '</option>'; });
    s.innerHTML = h;
    s.onchange = function(){ useShop(parseInt(s.value, 10)); };
    w.style.display = 'inline-block';
  }
  initDiag();
  useShop(0);
})();
</script>
