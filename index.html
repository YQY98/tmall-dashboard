<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天猫考核数据看板 · 吉曜旗舰店</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f5f7; --card:#fff; --bd:#e4e7ec; --tx:#1f2328; --mu:#6b7280;
    --good:#16a34a; --bad:#dc2626; --flat:#9ca3af; --ac:#2563eb;
    --goodbg:#eafaf0; --badbg:#fdecec;
  }
  body{background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:14px;line-height:1.5;padding:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:16px}
  h1{font-size:19px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--mu);font-size:12.5px;margin-top:5px}
  .sub b{color:var(--tx);font-weight:600}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .ct{font-size:14px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ct .hint{font-weight:400;color:var(--mu);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.grid{grid-template-columns:1fr}}
  .kpi{border:1px solid var(--bd);border-radius:9px;padding:11px 12px;background:#fff}
  .kpi .nm{font-size:12px;color:var(--mu);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .vl{font-size:21px;font-weight:680;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .vl small{font-size:12px;font-weight:500;color:var(--mu);margin-left:2px}
  .kpi .ft{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;flex-wrap:wrap}
  .sc{background:#eef2f7;color:#334155;border-radius:4px;padding:1px 6px;font-weight:600;font-variant-numeric:tabular-nums}
  .ch{font-weight:600;font-variant-numeric:tabular-nums}
  .ch.up{color:var(--good)} .ch.dn{color:var(--bad)} .ch.eq{color:var(--flat)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid #f0f2f5;font-size:12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-right:12px}
  thead th{color:var(--mu);font-weight:600;font-size:11px;border-bottom:1px solid var(--bd)}
  tbody tr:hover{background:#fafbfc}
  td .d{font-weight:600}
  td .sc{padding:1px 4px;margin-left:4px}
  td .c{font-size:10px;margin-left:3px}
  .c.up{color:var(--good)} .c.dn{color:var(--bad)} .c.eq{color:var(--flat)}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  select{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  svg{display:block;width:100%;height:auto}
  footer{color:var(--mu);font-size:11.5px;text-align:center;padding:14px 0 6px;line-height:1.7}
  .empty{padding:26px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>天猫考核数据看板 <span id="shopSelWrap" style="display:none"><select id="shopSel"></select></span></h1>
    <div class="sub"><b id="shop">—</b> · 数据区间 <b id="range">—</b> · 共 <b id="days">0</b> 天 · 更新于 <b id="upd">—</b></div>
  </header>

  <div class="card">
    <div class="ct">最新一天指标 <span class="hint" id="latestDay"></span></div>
    <div class="grid" id="kpis"></div>
    <div class="lg">
      <span><i style="background:var(--good)"></i>绿 = 向好（越低越好的指标下降 / 越高越好的指标上升）</span>
      <span><i style="background:var(--bad)"></i>红 = 恶化</span>
    </div>
  </div>

  <div class="card">
    <div class="ct">趋势 <select id="msel"></select></div>
    <div id="chart"></div>
  </div>

  <div class="card">
    <div class="ct">每日明细 <span class="hint">数值 · 得分 · 较前一日</span></div>
    <div class="tw"><table id="tbl"></table></div>
  </div>

  <footer>
    数据来源：天猫体验中心 VOC 真实体验分（自动抓取）<br>
    本页为只读看板，每日自动更新 —— <span id="upd2">—</span>
  </footer>
</div>

  prev = DAYS.length > 1 ? DAYS[DAYS.length-2] : null;
  renderAll();
}

function fmt(v, u){
  if(v === null || v === undefined) return '—';
  var n = Number(v);
  if(isNaN(n)) return '—';
  var s = (u === '%') ? n.toFixed(2) : (Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(2));
  return s + (u || '');
}
function cls(delta, better){
  if(delta === null || delta === undefined || Math.abs(delta) < 1e-9) return 'eq';
  var improved = better === 'low' ? delta < 0 : delta > 0;
  return improved ? 'up' : 'dn';
}
function arrow(delta){
  if(delta === null || delta === undefined || Math.abs(delta) < 1e-9) return '—';
  return (delta > 0 ? '↑' : '↓') + fmt(Math.abs(delta), '');
}

function renderHead(){
  var s = SHOPS[SI] || {};
  document.getElementById('shop').textContent = s.name || '—';
  document.getElementById('range').textContent = DAYS.length ? (DAYS[0] + ' ~ ' + DAYS[DAYS.length-1]) : '—';
  document.getElementById('days').textContent = DAYS.length;
  document.getElementById('upd').textContent = DATA.updatedAt || '—';
  document.getElementById('upd2').textContent = DATA.updatedAt || '—';
  document.getElementById('latestDay').textContent = last ? ('（' + last + '）') : '';
}

function renderKpi(){
  var box = document.getElementById('kpis');
  if(!last){ box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  var html = '';
  M.forEach(function(m){
    var cur = (R[last] || {})[m.key], pv = prev ? (R[prev] || {})[m.key] : null;
    var v = cur ? cur.value : null, scv = cur ? cur.score : null;
    var d = (cur && pv && cur.value !== null && pv.value !== null) ? (cur.value - pv.value) : null;
    html += '<div class="kpi">'
      + '<div class="nm" title="' + m.name + '">' + m.name + '</div>'
      + '<div class="vl">' + fmt(v, m.unit).replace(m.unit, '') + '<small>' + (m.unit||'') + '</small></div>'
      + '<div class="ft"><span class="sc">' + (scv !== null && scv !== undefined ? Number(scv).toFixed(1) : '—') + ' 分</span>'
      + '<span class="ch ' + cls(d, m.better) + '">' + arrow(d) + '</span>'
      + '</div></div>';
  });
  box.innerHTML = html;
}

function fillSel(){
  var s = document.getElementById('msel'), h = '';
  M.forEach(function(m, i){ h += '<option value="' + m.key + '"' + (i===0?' selected':'') + '>' + m.name + '</option>'; });
  s.innerHTML = h;
  if(!s.onchange) s.onchange = function(){ draw(s.value); };
}

function draw(key){
  var m = null;
  M.forEach(function(x){ if(x.key === key) m = x; });
  var el = document.getElementById('chart');
  var pts = DAYS.map(function(d){
    var r = (R[d] || {})[key];
    return { d: d, v: r ? r.value : null, s: r ? r.score : null };
  }).filter(function(p){ return p.v !== null && p.v !== undefined; });
  if(pts.length < 2){ el.innerHTML = '<div class="empty">该指标数据不足</div>'; return; }

  var W = 1000, H = 260, PL = 52, PR = 46, PT = 18, PB = 34;
  var vals = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var pad = (mx - mn) || (Math.abs(mx) || 1);
  mn = mn - pad*0.18; mx = mx + pad*0.18;
  var x = function(i){ return PL + (W-PL-PR) * (pts.length===1 ? .5 : i/(pts.length-1)); };
  var y = function(v){ return PT + (H-PT-PB) * (1 - (v-mn)/((mx-mn)||1)); };

  var g = '';
  for(var i=0;i<=4;i++){
    var vv = mn + (mx-mn)*i/4, yy = y(vv);
    g += '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#eef1f5" stroke-width="1"/>'
       + '<text x="'+(PL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#9aa3af">'+fmt(vv,'').slice(0,6)+'</text>';
  }
  var line = '', area = '', dots = '';
  pts.forEach(function(p, i){
    var px = x(i), py = y(p.v);
    line += (i ? ' L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
    dots += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.2" fill="#fff" stroke="#2563eb" stroke-width="2"/>';
    if(i === pts.length-1){
      dots += '<text x="'+px.toFixed(1)+'" y="'+(py-11)+'" text-anchor="end" font-size="12" font-weight="700" fill="#1f2328">'+fmt(p.v,m.unit)+'</text>';
    }
  });
  area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-PB) + ' L' + x(0).toFixed(1) + ' ' + (H-PB) + ' Z';
  var lbl = '';
  var step = Math.ceil(pts.length/8);
  pts.forEach(function(p, i){
    if(i % step === 0 || i === pts.length-1){
      lbl += '<text x="'+x(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" fill="#9aa3af">'+p.d.slice(5)+'</text>';
    }
  });
  var best = m.better === 'low' ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
  var worst = m.better === 'low' ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:260px">'
    + g
    + '<path d="'+area+'" fill="#2563eb" opacity="0.07"/>'
    + '<path d="'+line+'" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + lbl
    + '</svg>'
    + '<div class="lg"><span>区间最好 <b style="color:#16a34a">'+fmt(best,m.unit)+'</b></span>'
    + '<span>区间最差 <b style="color:#dc2626">'+fmt(worst,m.unit)+'</b></span>'
    + '<span>' + (m.better==='low' ? '越低越好' : '越高越好') + '</span></div>';
}

function renderTable(){
  var t = document.getElementById('tbl');
  if(!DAYS.length){ t.innerHTML = '<tr><td class="empty">暂无数据</td></tr>'; return; }
  var h = '<thead><tr><th>日期</th>';
  M.forEach(function(m){ h += '<th title="' + m.name + '">' + (m.short || m.name) + '</th>'; });
  h += '</tr></thead><tbody>';
  DAYS.slice().reverse().forEach(function(d, idx){
    var r = R[d] || {};
    var pd = DAYS[DAYS.length - 2 - idx] || null, pr = pd ? (R[pd] || {}) : null;
    h += '<tr><td>' + d + '</td>';
    M.forEach(function(m){
      var c = r[m.key], p = pr ? pr[m.key] : null;
      var v = c ? c.value : null, sc = c ? c.score : null;
      var dv = (c && p && c.value !== null && p.value !== null) ? (c.value - p.value) : null;
      h += '<td><span class="d">' + fmt(v, m.unit) + '</span>'
         + '<span class="sc" style="margin-left:5px">' + (sc !== null && sc !== undefined ? Number(sc).toFixed(1) : '—') + '</span>'
         + '<span class="c ' + cls(dv, m.better) + '">' + arrow(dv) + '</span></td>';
    });
    h += '</tr>';
  });
  t.innerHTML = h + '</tbody>';
}

function renderAll(){
  renderHead(); renderKpi(); fillSel();
  draw(document.getElementById('msel').value);
  renderTable();
}

(function init(){
  document.title = '天猫考核数据看板 · ' + (SHOPS[0] ? SHOPS[0].name : '');
  if(SHOPS.length > 1){
    var w = document.getElementById('shopSelWrap'), s = document.getElementById('shopSel'), h = '';
    SHOPS.forEach(function(x, i){ h += '<option value="' + i + '">' + x.name + '</option>'; });
    s.innerHTML = h;
    s.onchange = function(){ useShop(parseInt(s.value, 10)); };
    w.style.display = 'inline-block';
  }
  useShop(0);
})();
</script>
</body>
</html>
